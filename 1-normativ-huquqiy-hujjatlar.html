<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normativ-huquqiy hujjatlarning qabul qilinishi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f8f3e8; --paper-2:#f1e9d8; --card:#fffdf8; --ink:#1b2440; --ink-soft:#4d5672; --line:#d9cdb3;
  --navy:#16224a; --gold:#b4893a; --gold-2:#d9b56a; --gold-soft:#f5ead2;
  --ok:#2c6e4f; --ok-soft:#e3f1e8; --bad:#8f2d38; --bad-soft:#f7e3e3;
  --confetti:#b4893a,#d9b56a,#16224a,#f0dca8,#8f2d38;
  --gap:0px; --cs-max:46px;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  background:
    radial-gradient(1200px 600px at 10% -10%, #fff8e6 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 110%, #efe2c6 0%, transparent 55%),
    var(--paper);
  overflow-x:hidden;
}
/* qog'oz teksturasi */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
  background-image:repeating-linear-gradient(0deg, rgba(120,90,40,.035) 0 1px, transparent 1px 3px),
                   repeating-linear-gradient(90deg, rgba(120,90,40,.025) 0 1px, transparent 1px 4px);}
/* fon emblemasi — tarozi */
.emblem{position:fixed;right:-120px;bottom:-140px;width:560px;height:560px;opacity:.06;z-index:0;pointer-events:none;animation:sway 14s ease-in-out infinite}
.emblem svg{width:100%;height:100%}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:34px 18px 60px}

/* Sarlavha */
header{text-align:center;margin-bottom:26px}
.kicker{font-family:var(--body);letter-spacing:.32em;text-transform:uppercase;font-size:13px;color:var(--gold);font-weight:700;opacity:0;animation:fadeDown .8s .1s forwards}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,4.6vw,54px);line-height:1.08;margin:10px auto 0;max-width:900px;color:var(--navy);opacity:0;animation:fadeUp .9s .25s cubic-bezier(.2,.7,.2,1) forwards}
#subtitle{font-style:italic;color:var(--ink-soft);margin:10px 0 0;opacity:0;animation:fadeUp .9s .45s forwards}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px auto 0;color:var(--gold)}
.orn i{display:block;height:1px;width:0;background:linear-gradient(90deg,transparent,var(--gold));animation:grow 1.2s .6s cubic-bezier(.2,.7,.2,1) forwards}
.orn i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.orn span{font-size:22px;opacity:0;animation:spinIn 1s .9s forwards}
@keyframes grow{to{width:min(220px,28vw)}}
@keyframes spinIn{from{opacity:0;transform:rotate(-180deg) scale(.3)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* Bo'limlar */
.tabs{position:relative;display:inline-flex;gap:36px;margin:24px auto 0;padding-bottom:8px;opacity:0;animation:fadeUp .8s .7s forwards}
.tab{border:0;background:none;font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink-soft);cursor:pointer;padding:4px 2px;transition:color .3s}
.tab[aria-selected="true"]{color:var(--navy)}
.tab-ind{position:absolute;left:0;bottom:0;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:transform .5s cubic-bezier(.6,.05,.2,1),width .5s cubic-bezier(.6,.05,.2,1)}

section.show{animation:fadeUp .6s cubic-bezier(.2,.7,.2,1)}
[hidden]{display:none!important}

.btn{font-family:var(--body);font-size:16px;font-weight:600;color:var(--navy);background:transparent;border:1.5px solid var(--navy);padding:10px 20px;border-radius:2px;cursor:pointer;position:relative;overflow:hidden;transition:color .35s;z-index:0}
.btn::before{content:"";position:absolute;inset:0;background:var(--navy);transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.6,.05,.2,1);z-index:-1}
.btn:hover:not(:disabled){color:#fff}
.btn:hover:not(:disabled)::before{transform:scaleX(1);transform-origin:left}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary::before{background:var(--gold)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* Jamoalar — plaketkalar */
.teams{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:6px 0 10px}
.team{position:relative;flex:0 1 230px;display:flex;align-items:center;gap:10px;padding:14px 14px 14px 12px;background:var(--card);border:1px solid var(--line);cursor:pointer;
  box-shadow:0 1px 0 #fff inset,0 8px 24px -14px rgba(60,40,10,.35);transition:transform .35s,box-shadow .35s,border-color .35s;animation:fadeUp .6s calc(var(--i)*.08s + .2s) both}
.team::after{content:"";position:absolute;inset:4px;border:1px solid var(--gold-soft);pointer-events:none;transition:border-color .35s}
.team:hover{transform:translateY(-3px)}
.team.active{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft),0 14px 30px -14px rgba(180,137,58,.6)}
.team.active::after{border-color:var(--gold-2)}
.tmark{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;color:var(--gold);border:1.5px solid var(--gold);font-size:16px}
.team.active .tmark{background:var(--gold);color:#fff;animation:pulseGold 2s infinite}
@keyframes pulseGold{0%{box-shadow:0 0 0 0 rgba(180,137,58,.55)}100%{box-shadow:0 0 0 12px rgba(180,137,58,0)}}
.team input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--serif);font-weight:700;font-size:18px;color:var(--navy)}
.team input:focus{outline:none;border-bottom:1px dashed var(--gold)}
.score{font-family:var(--serif);font-weight:800;font-size:30px;color:var(--navy);min-width:30px;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.score.bump{animation:bump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.7);color:var(--gold)}100%{transform:scale(1)}}
.adj{display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.adj button{width:22px;height:19px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);cursor:pointer;font-size:13px;line-height:1;padding:0}
.adj button:hover{border-color:var(--gold);color:var(--gold)}
.team-tools{display:flex;flex-direction:column;gap:6px;justify-content:center}
#turnNote{text-align:center;font-style:italic;color:var(--ink-soft);margin-bottom:18px;font-size:16px}
#turnNote b{color:var(--gold);font-style:normal;font-family:var(--serif)}

/* Savol varag'i */
.sheet{position:relative;background:var(--card);border:1px solid var(--line);padding:36px clamp(18px,4vw,54px) 30px;box-shadow:0 30px 60px -35px rgba(60,40,10,.45),0 2px 0 #fff inset}
.sheet::before{content:"";position:absolute;inset:10px;border:1px solid var(--gold-soft);pointer-events:none}
.sheet::after{content:"";position:absolute;inset:14px;border:1px solid rgba(180,137,58,.25);pointer-events:none}
.corner{position:absolute;width:22px;height:22px;border-color:var(--gold);border-style:solid;z-index:1}
.corner.tl{top:6px;left:6px;border-width:2px 0 0 2px}.corner.tr{top:6px;right:6px;border-width:2px 2px 0 0}
.corner.bl{bottom:6px;left:6px;border-width:0 0 2px 2px}.corner.br{bottom:6px;right:6px;border-width:0 2px 2px 0}
.qhead{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px}
#qnum{font-family:var(--serif);color:var(--gold);display:flex;align-items:baseline;gap:4px}
#qnum::before{content:"§";font-size:30px;margin-right:6px}
.qn-cur{font-size:34px;font-weight:800;color:var(--navy)}
.qn-sep,.qn-tot{font-size:18px;color:var(--ink-soft)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-family:var(--serif);font-weight:700;font-size:12px;cursor:pointer;padding:0;transition:transform .25s,background .3s}
.dot:hover{transform:translateY(-2px)}
.dot.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft);color:var(--navy)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.progress{position:relative;z-index:1;height:2px;background:var(--line);margin-bottom:22px}
#progressFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .8s cubic-bezier(.2,.7,.2,1)}
#question{position:relative;z-index:1;font-family:var(--serif);font-weight:700;font-size:clamp(22px,2.8vw,32px);line-height:1.3;color:var(--navy);margin:0 0 24px}
#question.enter{animation:inkIn .8s cubic-bezier(.2,.7,.2,1)}
@keyframes inkIn{from{opacity:0;filter:blur(8px);letter-spacing:.04em;transform:translateY(10px)}to{opacity:1;filter:none;letter-spacing:normal;transform:none}}
#options{position:relative;z-index:1;display:grid;gap:12px}
#options.enter .opt{animation:slideIn .6s calc(var(--i)*.09s + .15s) cubic-bezier(.2,.7,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.opt{position:relative;display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:15px 18px;background:transparent;border:1px solid var(--line);border-left:3px solid var(--line);color:var(--ink);font-family:var(--body);font-size:clamp(17px,1.9vw,21px);cursor:pointer;overflow:hidden;transition:border-color .3s,background .35s,transform .3s,opacity .4s}
.opt::before{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.6,.05,.2,1)}
.opt:hover:not(:disabled){border-left-color:var(--gold);background:var(--gold-soft);transform:translateX(6px)}
.opt:hover:not(:disabled)::before{transform:scaleX(1)}
.let{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--navy);font-family:var(--serif);font-weight:800;color:var(--navy);transition:all .35s}
.otext{flex:1}
.mark{flex:none;width:44px;height:44px}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.opt.correct{border-color:var(--ok);border-left-color:var(--ok);background:var(--ok-soft)}
.opt.correct .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.correct .mark{border:2px solid var(--ok);border-radius:50%;display:grid;place-items:center;color:var(--ok);font-size:24px;font-weight:800;transform:rotate(-12deg)}
.opt.correct .mark::after{content:"✓"}
.opt.wrong{border-color:var(--bad);border-left-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .otext{background:linear-gradient(var(--bad),var(--bad)) no-repeat 0 55%/100% 1.5px}
.opt.wrong .mark{display:grid;place-items:center;color:var(--bad);font-size:26px;font-weight:800}
.opt.wrong .mark::after{content:"✗"}
.opt.correct.now .mark{animation:stamp .7s .1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-40deg)}60%{opacity:1;transform:scale(.9) rotate(-8deg)}100%{transform:scale(1) rotate(-12deg)}}
.opt.correct.now{animation:glowOk 1.4s ease-out}
@keyframes glowOk{0%{box-shadow:0 0 0 0 rgba(44,110,79,.45)}100%{box-shadow:0 0 0 18px rgba(44,110,79,0)}}
.opt.wrong.now{animation:shake .55s}
.opt.wrong.now .otext{animation:strike .6s .2s both}
@keyframes strike{from{background-size:0 1.5px}to{background-size:100% 1.5px}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.feedback{position:relative;z-index:1;margin-top:22px;padding:18px 22px;border-left:4px solid;background:var(--paper)}
.feedback.now{animation:unroll .7s cubic-bezier(.2,.7,.2,1)}
@keyframes unroll{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0)}}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)} .feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback .t{display:block;font-family:var(--serif);font-size:26px;font-weight:800;margin-bottom:4px}
.feedback.ok .t{color:var(--ok)} .feedback.bad .t{color:var(--bad)}
.feedback .right{display:block;margin-bottom:4px}
.feedback .iz{display:block;font-style:italic;color:var(--ink-soft)}
.nav{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.nav .r{display:flex;gap:10px;flex-wrap:wrap}

/* Yakuniy */
#final{text-align:center}
#final.show{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1)}
.trophy{font-size:64px;animation:rise 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.4)}to{opacity:1;transform:none}}
#final h2{font-family:var(--serif);font-size:44px;margin:4px 0;color:var(--navy)}
.fsub{font-style:italic;color:var(--ink-soft);margin:0}
.rows{max-width:520px;margin:24px auto;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--line);background:var(--paper);font-family:var(--serif);font-size:22px;font-weight:700;animation:slideIn .6s calc(var(--i)*.15s + .4s) both}
.row .rk{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:16px}
.row .nm{flex:1;text-align:left}
.row.win{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 10px 30px -18px rgba(180,137,58,.9)}
.row.win .rk{background:var(--gold);color:#fff}
.winner{font-family:var(--serif);font-size:28px;font-weight:800;color:var(--gold);animation:fadeUp .8s 1s both}
.fbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Krossvord */
.cw-top{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
#bigClue{position:relative;z-index:1;text-align:center;font-family:var(--serif);font-size:clamp(20px,2.5vw,28px);font-weight:700;color:var(--navy);min-height:84px;padding:6px 10px 16px;margin-bottom:12px;border-bottom:1px solid var(--line)}
#bigClue.enter{animation:inkIn .6s}
#bigClue small{display:block;font-family:var(--body);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.bans{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.bans i{font-style:normal;color:var(--ok);font-size:1.1em;animation:fadeUp .5s calc(var(--i)*.06s) both}
#gridBox{position:relative;z-index:1;overflow:auto;padding:6px}
#grid{display:grid;width:max-content;margin:0 auto}
.cell{width:var(--cs);height:var(--cs);position:relative}
.cell.on{background:var(--card);outline:1px solid var(--navy);outline-offset:-0.5px;animation:tileIn .5s var(--d) both;transition:background .35s}
@keyframes tileIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#grid.ready .cell.on{animation:none}
.cell.on.hl{background:var(--gold-soft);animation:none}
.cell.on.hl .face{position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(217,181,106,.6) 50%,transparent 70%);background-size:250% 100%;animation:sheen 1.6s var(--h) ease-in-out}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.cell .n{position:absolute;top:2px;left:3px;font-family:var(--body);font-size:calc(var(--cs)*.26);font-weight:700;color:var(--gold);line-height:1;z-index:1}
.cell .l{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:calc(var(--cs)*.56);color:var(--navy)}
.cell.rev .l{animation:ink .7s var(--k) cubic-bezier(.2,.7,.2,1) both}
@keyframes ink{0%{opacity:0;clip-path:inset(0 100% 0 0);filter:blur(4px)}100%{opacity:1;clip-path:inset(0);filter:none}}
.cell.on.rev,#grid.ready .cell.on.rev{animation:flash .9s var(--k)}
@keyframes flash{0%,100%{background:var(--card)}30%{background:var(--gold-soft)}}
.clue-wrap{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);position:relative;z-index:1}
.clue-wrap h3{font-family:var(--serif);text-align:center;font-size:26px;margin:0 0 14px;color:var(--navy)}
#cluesA{columns:2 360px;column-gap:28px}
.clue{break-inside:avoid;display:flex;gap:12px;align-items:flex-start;padding:12px 10px;border-bottom:1px dashed var(--line);cursor:pointer;transition:background .3s,padding .3s;animation:fadeUp .5s calc(var(--i)*.04s) both}
.clue:hover{background:var(--gold-soft)}
.clue.sel{background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold);padding-left:16px}
.cn{flex:none;font-family:var(--serif);font-size:24px;font-weight:800;color:var(--gold);min-width:30px}
.ct{flex:1;font-size:16.5px}
.dir{font-family:var(--body);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:block}
.len{color:var(--ink-soft);font-style:italic;font-size:14px}
.ans{display:block;font-family:var(--serif);font-weight:800;color:var(--ok);letter-spacing:.14em;animation:fadeUp .5s both}
.clue.done .ct{color:var(--ink-soft)}
@media (max-width:640px){ .tabs{gap:22px} .mark{display:none!important} .sheet{padding:26px 16px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="emblem" aria-hidden="true">
  <svg viewBox="0 0 200 200" fill="none" stroke="#16224a" stroke-width="3" stroke-linecap="round">
    <path d="M100 20v150M60 175h80M100 40l-60 12M100 40l60 12"/><circle cx="100" cy="30" r="8"/>
    <path d="M40 52l-24 56h48zM160 52l-24 56h48z"/><path d="M16 108a24 12 0 0 0 48 0M136 108a24 12 0 0 0 48 0"/>
  </svg>
</div>
<div class="wrap">
  <header>
    <div class="kicker">Mustaqil ish</div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <div class="orn"><i></i><span>⚖</span><i></i></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="test">Test</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="cw">Krossvord</button>
      <span class="tab-ind"></span>
    </div>
  </header>

  <section id="tab-test">
    <div class="teams" id="teams"></div>
    <div id="turnNote"></div>
    <div class="sheet" id="qcard">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="qhead"><div id="qnum"></div><div class="dots" id="dots"></div></div>
      <div class="progress"><div id="progressFill"></div></div>
      <div id="question"></div>
      <div id="options"></div>
      <div id="feedback"></div>
      <div class="nav">
        <button class="btn" id="prevBtn">← Oldingi</button>
        <div class="r"><button class="btn" id="restartBtn">Qaytadan boshlash</button><button class="btn primary" id="nextBtn">Keyingi savol →</button></div>
      </div>
    </div>
    <div class="sheet" id="final" hidden></div>
  </section>

  <section id="tab-cw" hidden>
    <div class="sheet">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div id="bigClue"><small>Krossvord</small>Pastdagi savollardan birini tanlang</div>
      <div class="cw-top">
        <button class="btn small" id="showAll">Hammasini ko‘rsatish</button>
        <button class="btn small" id="hideAll">Hammasini yashirish</button>
      </div>
      <div id="gridBox"><div id="grid"></div></div>
      <div class="clue-wrap"><h3>Savollar</h3><div id="cluesA"></div></div>
    </div>
  </section>
</div>
<script>
const DATA = {
 "title": "Normativ-huquqiy hujjatlarning qabul qilinishi",
 "subtitle": "Mustaqil ish · Jamoaviy test va krossvord",
 "test": [
  {
   "q": "O‘zbekiston Respublikasida eng oliy yuridik kuchga ega bo‘lgan normativ-huquqiy hujjat qaysi?",

/* ---------- Konfetti ---------- */
const fx = document.createElement('canvas');
fx.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
document.body.appendChild(fx);
const ctx = fx.getContext('2d');
let parts = [], raf = null;
function sizeFx(){ const d = devicePixelRatio || 1; fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d,0,0,d,0,0); }
sizeFx(); addEventListener('resize', sizeFx);
function burst(x, y, n = 70, spread = 1){
  const colors = (cssVar('--confetti') || '#f5c542,#3b82f6').split(',').map(s => s.trim());
  const round = cssVar('--confetti-round') === '1';
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 7) * spread;
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 4*spread, g:.18 + Math.random()*.1, s:4 + Math.random()*6,
      r:Math.random()*6, vr:(Math.random()-.5)*.3, c:colors[i % colors.length], life:1, round});
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0, 0, fx.width, fx.height);
  parts.forEach(p => {
    p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .009;
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if (p.round){ ctx.shadowColor = p.c; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(0, 0, p.s/2, 0, 7); ctx.fill(); }
    else ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
    ctx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0,0,fx.width,fx.height), null);
}
function burstFrom(el, n, spread){ const r = el.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, n, spread); }

function layout(list){
  const words = list.map((w, i) => ({...w, idx:i, word:w.answer.toUpperCase().replace(/[^A-Z]/g, '')}));
  const base = words.slice().sort((a, b) => b.word.length - a.word.length);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let best = null;
  for (let t = 0; t < 60; t++){
    let order = base;
    if (t > 0){
      const rest = base.slice(1);
      for (let i = rest.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
      order = [base[0], ...rest];
    }
    const res = attempt(order);
    const score = res.loose * 100000 + res.rows * res.cols + Math.abs(res.rows - res.cols) * 3;
    if (!best || score < best.score) best = {...res, score};
  }
  return best;
}
function attempt(order){
  const cells = new Map(), key = (r, c) => r + ',' + c, placed = [];
  function can(w, r, c, dir){
    const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0, L = w.word.length;
    if (cells.has(key(r - dr, c - dc)) || cells.has(key(r + dr*L, c + dc*L))) return -1;
    let inter = 0;
    for (let k = 0; k < L; k++){
      const rr = r + dr*k, cc = c + dc*k, cell = cells.get(key(rr, cc));
      if (cell){ if (cell.ch !== w.word[k] || cell.dirs.has(dir)) return -1; inter++; }
      else if (cells.has(key(rr + dc, cc + dr)) || cells.has(key(rr - dc, cc - dr))) return -1;
    }
    return inter;
  }
  function put(w, r, c, dir){
    const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;
    for (let k = 0; k < w.word.length; k++){
      const kk = key(r + dr*k, c + dc*k);
      if (!cells.has(kk)) cells.set(kk, {ch:w.word[k], dirs:new Set()});
      cells.get(kk).dirs.add(dir);
    }
    placed.push({...w, r, c, dir});
  }
  function bounds(){
    let r0=Infinity,r1=-Infinity,c0=Infinity,c1=-Infinity;
    for (const k of cells.keys()){ const [r,c]=k.split(',').map(Number); r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c); }
    return {r0,r1,c0,c1};
  }
  put(order[0], 0, 0, 'A');
  let pending = order.slice(1), progress = true;
  while (pending.length && progress){
    progress = false;
    const rest = [];
    for (const w of pending){
      let best = null; const b = bounds();
      for (const [k, cell] of cells){
        const [r, c] = k.split(',').map(Number);
        for (let i = 0; i < w.word.length; i++){
          if (w.word[i] !== cell.ch) continue;
          for (const dir of ['A','D']){
            if (cell.dirs.has(dir)) continue;
            const sr = dir === 'D' ? r - i : r, sc = dir === 'A' ? c - i : c;
            const inter = can(w, sr, sc, dir);
            if (inter < 1) continue;
            const er = dir === 'D' ? sr + w.word.length - 1 : sr, ec = dir === 'A' ? sc + w.word.length - 1 : sc;
            const h = Math.max(b.r1, er) - Math.min(b.r0, sr) + 1, wd = Math.max(b.c1, ec) - Math.min(b.c0, sc) + 1;
            const score = inter * 40 - (h * wd) - Math.abs(h - wd) * 6;
            if (!best || score > best.score) best = {score, sr, sc, dir};
          }
        }
      }
      if (best){ put(w, best.sr, best.sc, best.dir); progress = true; } else rest.push(w);
    }
    pending = rest;
  }
  const loose = pending.length;
  for (const w of pending){ const b = bounds(); put(w, b.r1 + 2, b.c0, 'A'); }
  const b = bounds();
  placed.forEach(p => { p.r -= b.r0; p.c -= b.c0; });
  const starts = [...new Set(placed.map(p => key(p.r, p.c)))].map(k => k.split(',').map(Number)).sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  const num = new Map(starts.map((s, i) => [key(s[0], s[1]), i + 1]));
  placed.forEach(p => p.num = num.get(key(p.r, p.c)));
  return {rows:b.r1 - b.r0 + 1, cols:b.c1 - b.c0 + 1, placed, num, key, loose};
}

const CW = layout(DATA.cross);
const revealed = new Set();
let selected = null;
function cellsOf(p){ return [...p.word].map((ch, k) => [p.dir === 'D' ? p.r + k : p.r, p.dir === 'A' ? p.c + k : p.c, ch]); }
function buildGrid(){
  const g = $('grid');
  g.style.gridTemplateColumns = `repeat(${CW.cols}, var(--cs,36px))`;
  g.innerHTML = '';
  const on = {};
  CW.placed.forEach(p => cellsOf(p).forEach(([r, c]) => on[CW.key(r, c)] = true));
  for (let r = 0; r < CW.rows; r++) for (let c = 0; c < CW.cols; c++){
    const d = document.createElement('div'), k = CW.key(r, c);
    d.className = 'cell' + (on[k] ? ' on' : '');
    d.id = 'c' + r + '_' + c;
    d.style.setProperty('--d', (r + c) * 18 + 'ms');
    if (on[k]){
      d.innerHTML = '<span class="face"></span>' + (CW.num.has(k) ? `<span class="n">${CW.num.get(k)}</span>` : '') + '<span class="l"></span>';
    }
    g.appendChild(d);
  }
}
function paint(animIdx){
  document.querySelectorAll('.cell.on').forEach(c => { c.classList.remove('hl', 'filled'); c.querySelector('.l').textContent = ''; });
  CW.placed.forEach(p => {
    if (!revealed.has(p.idx)) return;
    cellsOf(p).forEach(([r, c, ch], k) => {
      const cell = $(`c${r}_${c}`), l = cell.querySelector('.l');
      l.textContent = ch; cell.classList.add('filled');
      if (animIdx === p.idx || animIdx === 'all'){
        const delay = animIdx === 'all' ? (r + c) * 35 : k * 90;
        cell.style.setProperty('--k', delay + 'ms');
        retrigger(cell, 'rev');
      }
    });
  });
  if (selected != null){
    const p = CW.placed.find(x => x.idx === selected);
    cellsOf(p).forEach(([r, c], k) => { const cell = $(`c${r}_${c}`); cell.style.setProperty('--h', k * 45 + 'ms'); cell.classList.add('hl'); });
  }
  document.querySelectorAll('.clue').forEach(el => {
    const idx = Number(el.dataset.idx), on = revealed.has(idx);
    el.classList.toggle('sel', idx === selected);
    el.classList.toggle('done', on);
    el.querySelector('.ans').hidden = !on;
    el.querySelector('button').textContent = on ? 'Yashirish' : 'Javobni ko‘rsatish';
  });
  const big = $('bigClue');
  if (selected != null){
    const p = CW.placed.find(x => x.idx === selected);
    big.innerHTML = `<small>${p.num} · ${p.dir === 'A' ? 'Eniga →' : 'Bo‘yiga ↓'} · ${p.word.length} ta harf</small><span class="bq">${esc(p.clue)}</span>` +
      (revealed.has(p.idx) ? `<span class="bans">${[...p.word].map((ch, i) => `<i style="--i:${i}">${ch}</i>`).join('')}</span>` : '');
  }
}
let lastSel = null;
function select(idx){ selected = idx; if (lastSel !== idx) retrigger($('bigClue'), 'enter'); lastSel = idx; }
function buildClues(){
  const box = $('cluesA');
  CW.placed.slice().sort((a, b) => a.num - b.num || (a.dir === 'A' ? -1 : 1)).forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'clue'; el.dataset.idx = p.idx; el.style.setProperty('--i', i);
    el.innerHTML = `<span class="cn">${p.num}</span><span class="ct"><b class="dir">${p.dir === 'A' ? '→ Eniga' : '↓ Bo‘yiga'}</b> ${esc(p.clue)} <span class="len">(${p.word.length} harf)</span><span class="ans" hidden>${p.word}</span></span>
      <button class="btn small">Javobni ko‘rsatish</button>`;
    el.addEventListener('click', () => { select(p.idx); paint(); });
    el.querySelector('button').addEventListener('click', e => {
      e.stopPropagation(); select(p.idx);
      if (revealed.has(p.idx)){ revealed.delete(p.idx); paint(); }
      else { revealed.add(p.idx); paint(p.idx); }
    });
    box.appendChild(el);
  });
}
function fitGrid(){
  const box = $('gridBox'), w = box.clientWidth - 12;
  if (w <= 0) return;
  const gap = parseFloat(cssVar('--gap')) || 0, max = parseFloat(cssVar('--cs-max')) || 44;
  const cs = Math.max(20, Math.min(max, Math.floor((w - gap * (CW.cols - 1)) / CW.cols)));
  $('grid').style.setProperty('--cs', cs + 'px');
}
$('showAll').onclick = () => { CW.placed.forEach(p => revealed.add(p.idx)); paint('all'); setTimeout(() => burstFrom($('grid'), 140, 1.4), 500); };
$('hideAll').onclick = () => { revealed.clear(); paint(); };
addEventListener('resize', fitGrid);
buildGrid(); buildClues(); paint(); fitGrid(); placeInd();

</script>
