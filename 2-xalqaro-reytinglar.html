<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xalqaro reytinglarning kundalik hayotimizga ta’siri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060914; --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09); --stroke:rgba(255,255,255,.12);
  --text:#eef2ff; --muted:#9aa4c7; --cyan:#22d3ee; --violet:#8b5cf6; --pink:#f472b6; --lime:#34d399; --red:#fb7185;
  --grad:linear-gradient(120deg,var(--cyan),var(--violet) 55%,var(--pink));
  --confetti:#22d3ee,#8b5cf6,#f472b6,#34d399,#facc15; --confetti-round:1;
  --gap:5px; --cs-max:46px;
  --head:"Sora","Space Grotesk",system-ui,sans-serif; --body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5;overflow-x:hidden}
/* Aurora fon */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora b{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen}
.aurora b:nth-child(1){width:52vw;height:52vw;left:-12vw;top:-18vw;background:#1d4ed8;animation:drift1 22s ease-in-out infinite}
.aurora b:nth-child(2){width:46vw;height:46vw;right:-14vw;top:4vw;background:#7c3aed;animation:drift2 26s ease-in-out infinite}
.aurora b:nth-child(3){width:40vw;height:40vw;left:24vw;bottom:-22vw;background:#0891b2;animation:drift3 30s ease-in-out infinite}
.aurora b:nth-child(4){width:24vw;height:24vw;right:16vw;bottom:-6vw;background:#db2777;opacity:.3;animation:drift1 34s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,8vw) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-10vw,12vw) scale(.9)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(8vw,-10vw) scale(1.2)}}
.gridlines{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);animation:pan 40s linear infinite}
@keyframes pan{to{background-position:56px 56px}}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:26px 20px 56px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:18px;min-width:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.globe{flex:none;position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#67e8f9,#3b82f6 45%,#312e81 100%);box-shadow:0 0 40px rgba(34,211,238,.45),inset -8px -10px 20px rgba(0,0,0,.45);overflow:hidden}
.globe::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.28) 9px 10px);background-size:40px 100%;animation:spinG 6s linear infinite}
.globe::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 11px,rgba(255,255,255,.2) 11px 12px)}
@keyframes spinG{to{background-position:40px 0}}
.orbit{position:absolute;inset:-9px;border:1px solid rgba(255,255,255,.25);border-radius:50%;transform:rotateX(70deg);animation:orb 5s linear infinite}
.orbit::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink)}
@keyframes orb{to{transform:rotateX(70deg) rotate(360deg)}}
.globe-wrap{position:relative;width:64px;height:64px;flex:none}
h1{margin:0;font-family:var(--head);font-weight:800;font-size:clamp(24px,3.4vw,40px);line-height:1.1;
  background:linear-gradient(90deg,#fff,#a5f3fc,#c4b5fd,#fbcfe8,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 8s linear infinite}
@keyframes shimmer{to{background-position:300% 0}}
#subtitle{margin:4px 0 0;color:var(--muted);letter-spacing:.04em}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

.tabs{position:relative;display:flex;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);animation:rise .9s .15s both}
.tab{position:relative;z-index:1;border:0;background:none;color:var(--muted);font-family:var(--head);font-weight:700;font-size:16px;padding:10px 24px;border-radius:999px;cursor:pointer;transition:color .4s}
.tab[aria-selected="true"]{color:#0b1020}
.tab-ind{position:absolute;top:5px;left:0;height:calc(100% - 10px);border-radius:999px;background:var(--grad);box-shadow:0 6px 24px -4px rgba(139,92,246,.7);transition:transform .55s cubic-bezier(.65,0,.25,1.3),width .55s cubic-bezier(.65,0,.25,1.3)}
section.show{animation:zoomIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes zoomIn{from{opacity:0;transform:scale(.97) translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
[hidden]{display:none!important}

.glass{position:relative;background:var(--glass);border:1px solid var(--stroke);border-radius:24px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 30px 80px -40px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08)}
/* aylanuvchi gradient chegara */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
.glow-border::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 60%,var(--cyan),var(--violet),var(--pink),transparent 95%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 6s linear infinite;pointer-events:none}
@keyframes rot{to{--ang:360deg}}

.btn{font-family:var(--head);font-weight:600;font-size:15px;color:var(--text);background:var(--glass-2);border:1px solid var(--stroke);padding:11px 20px;border-radius:14px;cursor:pointer;transition:transform .25s,box-shadow .3s,background .3s}
.btn:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.14);box-shadow:0 10px 30px -12px rgba(34,211,238,.6)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.primary{background:var(--grad);background-size:200% 100%;color:#0b1020;border:0;animation:gradMove 5s ease infinite}
@keyframes gradMove{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.btn.small{padding:7px 13px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.3;cursor:not-allowed}

/* Test layout: chapda jamoalar paneli */
.test-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.test-layout{grid-template-columns:minmax(0,1fr)}}
.side{padding:20px;position:sticky;top:20px;animation:rise .8s .25s both}
.side h3{margin:0 0 14px;font-family:var(--head);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.teams{display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.side{position:static}.teams{flex-direction:row;flex-wrap:wrap}.team{flex:1 1 200px}}
.team{position:relative;display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .35s,border-color .35s;animation:rise .6s calc(var(--i)*.08s + .35s) both}
.team:hover{transform:translateX(4px);background:rgba(255,255,255,.08)}
.team.active{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 0 34px -8px rgba(34,211,238,.55)}
.tmark{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--head);font-weight:800;background:rgba(255,255,255,.08);color:var(--muted)}
.team.active .tmark{background:var(--grad);color:#0b1020;animation:breath 2s ease-in-out infinite}
@keyframes breath{50%{box-shadow:0 0 0 6px rgba(139,92,246,.25),0 0 22px rgba(34,211,238,.6)}}
.team input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-family:var(--head);font-weight:600;font-size:16px}
.team input:focus{outline:none;color:var(--cyan)}
.score{font-family:var(--head);font-weight:800;font-size:28px;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.team.active .score{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.score.bump{animation:pop 0.8s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.8) rotate(-8deg);text-shadow:0 0 20px var(--cyan)}100%{transform:scale(1)}}
.adj{display:flex;flex-direction:column;gap:3px}
.adj button{width:22px;height:19px;border-radius:6px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer;font-size:13px;line-height:1;padding:0}
.adj button:hover{color:var(--cyan);border-color:var(--cyan)}
.team-tools{display:flex;gap:8px;margin-top:4px}
#turnNote{margin-top:16px;padding:12px 14px;border-radius:14px;background:rgba(34,211,238,.08);border:1px dashed rgba(34,211,238,.35);color:var(--muted);font-size:15px}
#turnNote b{color:var(--cyan);display:block;font-family:var(--head);font-size:18px}

/* Savol kartasi */
#qcard{padding:28px clamp(18px,3vw,40px) 26px;animation:rise .8s .3s both}
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
#qnum{font-family:var(--head);display:flex;align-items:baseline;gap:6px}
.qn-cur{font-size:56px;font-weight:800;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.qn-sep{color:var(--muted);font-size:22px}.qn-tot{color:var(--muted);font-size:22px;font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:6px;max-width:560px}
.dot{width:30px;height:30px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--muted);font-family:var(--head);font-weight:700;font-size:12px;cursor:pointer;padding:0;transition:transform .25s,background .3s,box-shadow .3s}
.dot:hover{transform:translateY(-3px) scale(1.08)}
.dot.cur{border-color:var(--cyan);color:var(--text);box-shadow:0 0 14px rgba(34,211,238,.5)}
.dot.ok{background:rgba(52,211,153,.22);border-color:var(--lime);color:var(--lime)}
.dot.bad{background:rgba(251,113,133,.2);border-color:var(--red);color:var(--red)}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.07);margin:18px 0 24px;overflow:hidden}
#progressFill{position:relative;height:100%;width:0;border-radius:99px;background:var(--grad);box-shadow:0 0 18px rgba(139,92,246,.8);transition:width 1s cubic-bezier(.2,.8,.2,1)}
#progressFill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:scan 2s linear infinite}
@keyframes scan{from{background-position:-100% 0}to{background-position:200% 0}}
#question{font-family:var(--head);font-weight:700;font-size:clamp(22px,2.7vw,32px);line-height:1.28;margin:0 0 26px}
#question.enter{animation:qIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes qIn{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
#options{display:grid;grid-template-columns:1fr 1fr;gap:14px;perspective:900px}
@media (max-width:720px){#options{grid-template-columns:1fr}}
#options.enter .opt{animation:flyIn .7s calc(var(--i)*.08s + .1s) cubic-bezier(.2,.9,.25,1.15) both}
@keyframes flyIn{from{opacity:0;transform:translateY(40px) rotateX(-35deg)}to{opacity:1;transform:none}}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:18px 18px;border-radius:18px;border:1px solid var(--stroke);background:rgba(255,255,255,.045);color:var(--text);font-family:var(--body);font-size:clamp(16px,1.8vw,20px);cursor:pointer;overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s,box-shadow .3s,opacity .4s}
.opt::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(34,211,238,.18),transparent 45%);opacity:0;transition:opacity .3s}
.opt:hover:not(:disabled){transform:translateY(-4px);border-color:rgba(34,211,238,.6);box-shadow:0 18px 40px -20px rgba(34,211,238,.7)}
.opt:hover:not(:disabled)::before{opacity:1}
.let{position:relative;flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-family:var(--head);font-weight:800;background:rgba(255,255,255,.08);transition:all .35s}
.opt:hover:not(:disabled) .let{background:var(--grad);color:#0b1020}
.otext{position:relative;flex:1}
.mark{position:relative;flex:none;font-size:22px;font-weight:800}
.opt:disabled{cursor:default}
.opt.dim{opacity:.35;transform:scale(.98)}
.opt.correct{border-color:var(--lime);background:rgba(52,211,153,.14);box-shadow:0 0 0 1px var(--lime),0 0 40px -8px rgba(52,211,153,.7)}
.opt.correct .let{background:var(--lime);color:#052e1f}
.opt.correct .mark::after{content:"✓";color:var(--lime)}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.13);box-shadow:0 0 0 1px var(--red)}
.opt.wrong .let{background:var(--red);color:#3b0712}
.opt.wrong .mark::after{content:"✕";color:var(--red)}
.opt.correct.now{animation:okPulse 1.1s cubic-bezier(.2,.8,.2,1)}
.opt.correct.now::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;border:2px solid var(--lime);transform:translate(-50%,-50%);animation:ripple 1s ease-out forwards}
@keyframes ripple{from{opacity:1;width:20px;height:20px}to{opacity:0;width:600px;height:600px}}
@keyframes okPulse{0%{transform:scale(1)}30%{transform:scale(1.04)}100%{transform:scale(1)}}
.opt.now .mark{animation:markIn .6s .15s cubic-bezier(.3,1.7,.5,1) both}
@keyframes markIn{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
.opt.wrong.now{animation:glitch .6s}
@keyframes glitch{0%,100%{transform:none}15%{transform:translate(-8px,0) skewX(-6deg)}30%{transform:translate(7px,0) skewX(5deg)}45%{transform:translate(-5px,0)}60%{transform:translate(4px,0)}75%{transform:translate(-2px,0)}}

.feedback{margin-top:22px;padding:18px 20px;border-radius:18px;border:1px solid}
.feedback.now{animation:fbIn .6s cubic-bezier(.2,.9,.25,1.2)}
@keyframes fbIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.feedback.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.5)}
.feedback.bad{background:rgba(251,113,133,.09);border-color:rgba(251,113,133,.5)}
.feedback .t{display:block;font-family:var(--head);font-size:24px;font-weight:800;margin-bottom:4px}
.feedback.ok .t{color:var(--lime)} .feedback.bad .t{color:var(--red)}
.feedback .right{display:block;margin-bottom:4px}
.feedback .iz{display:block;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
.nav .r{display:flex;gap:10px;flex-wrap:wrap}

#final{padding:36px 20px;text-align:center}
#final.show{animation:zoomIn .8s cubic-bezier(.2,.8,.2,1)}
.trophy{font-size:72px;filter:drop-shadow(0 0 30px rgba(250,204,21,.6));animation:float 3s ease-in-out infinite, spinIn 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes spinIn{from{transform:scale(0) rotate(-200deg)}}
#final h2{margin:6px 0;font-family:var(--head);font-size:42px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.fsub{color:var(--muted);margin:0}
.rows{max-width:540px;margin:26px auto;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);font-family:var(--head);font-size:21px;font-weight:700;animation:flyIn .7s calc(var(--i)*.12s + .3s) both}
.row .rk{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:15px}
.row .nm{flex:1;text-align:left}
.row.win{background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 0 40px -10px rgba(139,92,246,.8)}
.row.win .rk{background:var(--grad);color:#0b1020}
.winner{font-family:var(--head);font-size:28px;font-weight:800;color:#facc15;text-shadow:0 0 24px rgba(250,204,21,.5);animation:rise .8s 1s both}
.fbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Krossvord */
.cw-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:22px;align-items:start}
@media (max-width:980px){.cw-layout{grid-template-columns:minmax(0,1fr)}}
.cw-main{padding:22px}
#bigClue{position:relative;padding:16px 20px;border-radius:18px;background:linear-gradient(120deg,rgba(34,211,238,.12),rgba(139,92,246,.12));border:1px solid rgba(139,92,246,.3);font-family:var(--head);font-weight:700;font-size:clamp(18px,2.2vw,25px);min-height:82px;margin-bottom:16px}
#bigClue.enter{animation:qIn .55s cubic-bezier(.2,.8,.2,1)}
#bigClue small{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.bans{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.bans i{font-style:normal;width:34px;height:38px;display:grid;place-items:center;border-radius:9px;background:rgba(52,211,153,.16);color:var(--lime);border:1px solid rgba(52,211,153,.4);animation:flyIn .5s calc(var(--i)*.05s) both}
.cw-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
#gridBox{overflow:auto;padding:8px;perspective:1000px}
#grid{display:grid;gap:var(--gap);width:max-content;margin:0 auto}
.cell{width:var(--cs);height:var(--cs);position:relative}
.cell.on{border-radius:calc(var(--cs)*.22);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);transform-style:preserve-3d;animation:cellIn .6s var(--d) cubic-bezier(.2,.9,.25,1.2) both;transition:background .35s,border-color .35s,box-shadow .35s}
@keyframes cellIn{from{opacity:0;transform:scale(.2) rotate(-20deg)}to{opacity:1;transform:none}}
#grid.ready .cell.on{animation:none}
.cell.on.hl,#grid .cell.on.hl{background:rgba(34,211,238,.18);border-color:var(--cyan);box-shadow:0 0 16px -2px rgba(34,211,238,.7);animation:hlPulse .6s var(--h) both}
@keyframes hlPulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.cell.filled{background:rgba(139,92,246,.22);border-color:rgba(196,181,253,.55)}
.cell.on.rev,#grid.ready .cell.on.rev{animation:flip .7s var(--k) cubic-bezier(.3,.9,.3,1.2) both}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg);background:var(--violet)}100%{transform:rotateY(0)}}
.cell .n{position:absolute;top:2px;left:4px;font-family:var(--head);font-size:calc(var(--cs)*.25);font-weight:700;color:var(--muted);line-height:1;z-index:1}
.cell .l{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:calc(var(--cs)*.52);color:#fff;text-shadow:0 0 12px rgba(196,181,253,.9)}
.cell.rev .l{animation:letterIn .7s var(--k) both}
@keyframes letterIn{0%,45%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
.clues{padding:20px;max-height:calc(100vh - 60px);overflow:auto;position:sticky;top:20px}
@media (max-width:980px){.clues{position:static;max-height:none}}
.clues h3{margin:0 0 12px;font-family:var(--head);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.clue{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid transparent;cursor:pointer;transition:background .3s,border-color .3s,transform .3s;animation:rise .5s calc(var(--i)*.05s + .1s) both}
.clue:hover{background:rgba(255,255,255,.06);transform:translateX(4px)}
.clue.sel{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.5)}

const $ = id => document.getElementById(id);

$('subtitle').textContent = DATA.subtitle;
function esc(s){return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function retrigger(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- Konfetti ---------- */
const fx = document.createElement('canvas');
fx.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
document.body.appendChild(fx);
const ctx = fx.getContext('2d');
let parts = [], raf = null;
function sizeFx(){ const d = devicePixelRatio || 1; fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d,0,0,d,0,0); }
sizeFx(); addEventListener('resize', sizeFx);
function burst(x, y, n = 70, spread = 1){
  const colors = (cssVar('--confetti') || '#f5c542,#3b82f6').split(',').map(s => s.trim());
  const round = cssVar('--confetti-round') === '1';
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 7) * spread;
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 4*spread, g:.18 + Math.random()*.1, s:4 + Math.random()*6,
      r:Math.random()*6, vr:(Math.random()-.5)*.3, c:colors[i % colors.length], life:1, round});
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0, 0, fx.width, fx.height);
  parts.forEach(p => {
    p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .009;
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if (p.round){ ctx.shadowColor = p.c; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(0, 0, p.s/2, 0, 7); ctx.fill(); }
    else ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
    ctx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0,0,fx.width,fx.height), null);
}
function burstFrom(el, n, spread){ const r = el.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, n, spread); }

/* ---------- TEST ---------- */
const LET = ['A','B','C','D','E','F'];
let teams, active, cur, answers, bumpIdx = null, shown = -1, fresh = false;
function resetTest(keepNames){
  const names = keepNames && teams ? teams.map(t => t.name) : ['1-jamoa','2-jamoa'];
  teams = names.map(n => ({name:n, score:0}));
  active = 0; cur = 0; shown = -1;
  answers = DATA.test.map(() => null);
  $('final').hidden = true; $('qcard').hidden = false;
  renderTeams(); renderQ();
}
function renderTeams(){
  const box = $('teams'); box.innerHTML = '';
  teams.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'team' + (i === active ? ' active' : '');
    d.style.setProperty('--i', i);
    d.title = 'Javob beruvchi jamoa sifatida tanlash';
    d.innerHTML = `<span class="tmark">${i+1}</span><input aria-label="Jamoa nomi"><span class="score">${t.score}</span>
      <span class="adj"><button data-d="1" title="Ball qo‘shish">+</button><button data-d="-1" title="Ball ayirish">−</button></span>`;
    const inp = d.querySelector('input'); inp.value = t.name;
    inp.addEventListener('input', () => { t.name = inp.value || `${i+1}-jamoa`; renderTurn(); });
    inp.addEventListener('click', e => e.stopPropagation());
    d.querySelectorAll('.adj button').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation(); t.score = Math.max(0, t.score + Number(b.dataset.d)); bumpIdx = i; renderTeams();
    }));
    d.addEventListener('click', () => { active = i; renderTeams(); });
    box.appendChild(d);
    if (bumpIdx === i) retrigger(d.querySelector('.score'), 'bump');
  });
  bumpIdx = null;
  const tools = document.createElement('div');
  tools.className = 'team-tools';
  tools.innerHTML = `<button class="btn small" id="addT" ${teams.length>=6?'disabled':''}>+ Jamoa</button>
    <button class="btn small" id="remT" ${teams.length<=1?'disabled':''}>− Jamoa</button>`;
  box.appendChild(tools);
  tools.querySelector('#addT').onclick = () => { teams.push({name:`${teams.length+1}-jamoa`, score:0}); renderTeams(); };
  tools.querySelector('#remT').onclick = () => { teams.pop(); if (active >= teams.length) active = 0; renderTeams(); };
  renderTurn();
}
function renderTurn(){
  const a = answers[cur], el = $('turnNote');
  el.innerHTML = a ? `Bu savolga <b>${esc(teams[a.team] ? teams[a.team].name : '—')}</b> javob berdi`
                   : `Hozir javob beradi: <b>${esc(teams[active].name)}</b>`;
}
function renderQ(){
  const q = DATA.test[cur], a = answers[cur], changed = shown !== cur;
  shown = cur;
  const total = DATA.test.length;
  $('qnum').innerHTML = `<span class="qn-cur">${String(cur+1).padStart(2,'0')}</span><span class="qn-sep">/</span><span class="qn-tot">${String(total).padStart(2,'0')}</span>`;
  const pf = $('progressFill'); if (pf) pf.style.width = (answers.filter(Boolean).length / total * 100) + '%';
  $('question').textContent = q.q;
  const dots = $('dots'); dots.innerHTML = '';
  DATA.test.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'dot' + (i === cur ? ' cur' : '') + (answers[i] ? (answers[i].ok ? ' ok' : ' bad') : '');
    b.textContent = i + 1; b.title = `${i+1}-savol`;
    b.onclick = () => { cur = i; renderQ(); };
    dots.appendChild(b);
  });
  const box = $('options'); box.innerHTML = '';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.style.setProperty('--i', i);
    b.innerHTML = `<span class="let">${LET[i]}</span><span class="otext">${esc(o)}</span><span class="mark"></span>`;
    if (a){
      b.disabled = true;
      if (i === q.correct) b.classList.add('correct');
      else if (i === a.chosen) b.classList.add('wrong');
      else b.classList.add('dim');
      if (fresh && (i === q.correct || i === a.chosen)) b.classList.add('now');
    } else b.onclick = () => choose(i, b);
    box.appendChild(b);
  });
  if (changed){ retrigger($('question'), 'enter'); retrigger(box, 'enter'); }
  const fb = $('feedback');
  if (a){
    fb.className = 'feedback ' + (a.ok ? 'ok' : 'bad') + (fresh ? ' now' : '');
    fb.innerHTML = `<span class="t">${a.ok ? 'To‘g‘ri javob!' : 'Noto‘g‘ri javob'}</span>` +
      (a.ok ? '' : `<span class="right">To‘g‘ri javob: <b>${LET[q.correct]}) ${esc(q.options[q.correct])}</b></span>`) +
      (q.izoh ? `<span class="iz">${esc(q.izoh)}</span>` : '');
  } else { fb.className = 'feedback-empty'; fb.innerHTML = ''; }
  $('prevBtn').disabled = cur === 0;
  $('nextBtn').textContent = cur === total - 1 ? 'Natijalar →' : 'Keyingi savol →';
  renderTurn();
  if (fresh){
    fresh = false;
    const ok = answers[cur].ok;
    const target = box.children[ok ? q.correct : answers[cur].chosen];
    if (ok) setTimeout(() => burstFrom(target, 80, 1), 120);
  }
}
function choose(i){
  const q = DATA.test[cur], ok = i === q.correct;
  answers[cur] = {chosen:i, team:active, ok};
  if (ok){ teams[active].score++; bumpIdx = active; }
  active = (active + 1) % teams.length;
  fresh = true;
  renderTeams(); renderQ();
}
$('prevBtn').onclick = () => { if (cur > 0){ cur--; renderQ(); } };
$('nextBtn').onclick = () => { if (cur < DATA.test.length - 1){ cur++; renderQ(); } else showFinal(); };
$('restartBtn').onclick = () => { if (confirm('Test qaytadan boshlansinmi? Ballar nolga tushadi.')) resetTest(true); };
function showFinal(){
  const f = $('final');
  const max = Math.max(...teams.map(t => t.score));
  const sorted = teams.slice().sort((a, b) => b.score - a.score);
  const winners = teams.filter(t => t.score === max);
  const answered = answers.filter(Boolean).length;
  f.innerHTML = `<div class="trophy">🏆</div><h2>Natijalar</h2>
    <p class="fsub">${answered} ta savolga javob berildi · jami ${DATA.test.length} ta</p>
    <div class="rows">${sorted.map((t, i) => `<div class="row ${t.score === max && max > 0 ? 'win' : ''}" style="--i:${i}"><span class="rk">${i+1}</span><span class="nm">${esc(t.name)}</span><span class="pt">${t.score} ball</span></div>`).join('')}</div>
    <p class="winner">${max === 0 ? 'Hali hech kim ball to‘plamadi' : winners.length > 1 ? 'Durang: ' + winners.map(w => esc(w.name)).join(', ') : 'G‘olib: ' + esc(winners[0].name)}</p>
    <div class="fbtns"><button class="btn" id="backQ">← Savollarga qaytish</button>
      <button class="btn primary" id="again">Qaytadan boshlash</button></div>`;
  $('qcard').hidden = true; f.hidden = false; retrigger(f, 'show');
  f.querySelector('#backQ').onclick = () => { f.hidden = true; $('qcard').hidden = false; shown = -1; renderQ(); };
  f.querySelector('#again').onclick = () => resetTest(true);
  if (max > 0){ [0, 350, 700].forEach((d, k) => setTimeout(() => burst(innerWidth * (0.2 + 0.3*k), innerHeight * .35, 110, 1.3), d)); }
}
resetTest(false);

/* ---------- KROSSVORD ---------- */
function layout(list){
  const words = list.map((w, i) => ({...w, idx:i, word:w.answer.toUpperCase().replace(/[^A-Z]/g, '')}));
  const base = words.slice().sort((a, b) => b.word.length - a.word.length);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let best = null;
  for (let t = 0; t < 60; t++){
    let order = base;
    if (t > 0){
      const rest = base.slice(1);
      for (let i = rest.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
      order = [base[0], ...rest];
    }
    const res = attempt(order);
    const score = res.loose * 100000 + res.rows * res.cols + Math.abs(res.rows - res.cols) * 3;
    if (!best || score < best.score) best = {...res, score};
  }
  return best;
}
function attempt(order){
  const cells = new Map(), key = (r, c) => r + ',' + c, placed = [];
  function can(w, r, c, dir){
    const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0, L = w.word.length;
    if (cells.has(key(r - dr, c - dc)) || cells.has(key(r + dr*L, c + dc*L))) return -1;
    let inter = 0;
    for (let k = 0; k < L; k++){
      const rr = r + dr*k, cc = c + dc*k, cell = cells.get(key(rr, cc));
      if (cell){ if (cell.ch !== w.word[k] || cell.dirs.has(dir)) return -1; inter++; }
      else if (cells.has(key(rr + dc, cc + dr)) || cells.has(key(rr - dc, cc - dr))) return -1;
    }
    return inter;
  }
  function put(w, r, c, dir){
    const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;
    for (let k = 0; k < w.word.length; k++){
      const kk = key(r + dr*k, c + dc*k);
      if (!cells.has(kk)) cells.set(kk, {ch:w.word[k], dirs:new Set()});
      cells.get(kk).dirs.add(dir);
    }
    placed.push({...w, r, c, dir});
  }
  function bounds(){
    let r0=Infinity,r1=-Infinity,c0=Infinity,c1=-Infinity;
    for (const k of cells.keys()){ const [r,c]=k.split(',').map(Number); r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c); }
    return {r0,r1,c0,c1};
  }
  put(order[0], 0, 0, 'A');
  let pending = order.slice(1), progress = true;
  while (pending.length && progress){
    progress = false;
    const rest = [];
    for (const w of pending){
      let best = null; const b = bounds();
      for (const [k, cell] of cells){
        const [r, c] = k.split(',').map(Number);
        for (let i = 0; i < w.word.length; i++){
          if (w.word[i] !== cell.ch) continue;
          for (const dir of ['A','D']){
            if (cell.dirs.has(dir)) continue;
            const sr = dir === 'D' ? r - i : r, sc = dir === 'A' ? c - i : c;
            const inter = can(w, sr, sc, dir);
            if (inter < 1) continue;
            const er = dir === 'D' ? sr + w.word.length - 1 : sr, ec = dir === 'A' ? sc + w.word.length - 1 : sc;
            const h = Math.max(b.r1, er) - Math.min(b.r0, sr) + 1, wd = Math.max(b.c1, ec) - Math.min(b.c0, sc) + 1;
            const score = inter * 40 - (h * wd) - Math.abs(h - wd) * 6;
            if (!best || score > best.score) best = {score, sr, sc, dir};
          }
        }
      }
      if (best){ put(w, best.sr, best.sc, best.dir); progress = true; } else rest.push(w);
    }
    pending = rest;
  }
  const loose = pending.length;
  for (const w of pending){ const b = bounds(); put(w, b.r1 + 2, b.c0, 'A'); }
  const b = bounds();
  placed.forEach(p => { p.r -= b.r0; p.c -= b.c0; });
  const starts = [...new Set(placed.map(p => key(p.r, p.c)))].map(k => k.split(',').map(Number)).sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  const num = new Map(starts.map((s, i) => [key(s[0], s[1]), i + 1]));
  placed.forEach(p => p.num = num.get(key(p.r, p.c)));
  return {rows:b.r1 - b.r0 + 1, cols:b.c1 - b.c0 + 1, placed, num, key, loose};
}

const CW = layout(DATA.cross);
const revealed = new Set();
let selected = null;
function cellsOf(p){ return [...p.word].map((ch, k) => [p.dir === 'D' ? p.r + k : p.r, p.dir === 'A' ? p.c + k : p.c, ch]); }
function buildGrid(){
  const g = $('grid');
  g.style.gridTemplateColumns = `repeat(${CW.cols}, var(--cs,36px))`;
  g.innerHTML = '';
  const on = {};
  CW.placed.forEach(p => cellsOf(p).forEach(([r, c]) => on[CW.key(r, c)] = true));
  for (let r = 0; r < CW.rows; r++) for (let c = 0; c < CW.cols; c++){
    const d = document.createElement('div'), k = CW.key(r, c);
    d.className = 'cell' + (on[k] ? ' on' : '');
    d.id = 'c' + r + '_' + c;
    d.style.setProperty('--d', (r + c) * 18 + 'ms');
    if (on[k]){
      d.innerHTML = '<span class="face"></span>' + (CW.num.has(k) ? `<span class="n">${CW.num.get(k)}</span>` : '') + '<span class="l"></span>';
    }
    g.appendChild(d);
  }
}
function paint(animIdx){
  document.querySelectorAll('.cell.on').forEach(c => { c.classList.remove('hl', 'filled'); c.querySelector('.l').textContent = ''; });
  CW.placed.forEach(p => {
    if (!revealed.has(p.idx)) return;
    cellsOf(p).forEach(([r, c, ch], k) => {
      const cell = $(`c${r}_${c}`), l = cell.querySelector('.l');
      l.textContent = ch; cell.classList.add('filled');
      if (animIdx === p.idx || animIdx === 'all'){
        const delay = animIdx === 'all' ? (r + c) * 35 : k * 90;
        cell.style.setProperty('--k', delay + 'ms');
        retrigger(cell, 'rev');
      }
    });
  });
  if (selected != null){
    const p = CW.placed.find(x => x.idx === selected);
    cellsOf(p).forEach(([r, c], k) => { const cell = $(`c${r}_${c}`); cell.style.setProperty('--h', k * 45 + 'ms'); cell.classList.add('hl'); });
  }
  document.querySelectorAll('.clue').forEach(el => {
    const idx = Number(el.dataset.idx), on = revealed.has(idx);
    el.classList.toggle('sel', idx === selected);
    el.classList.toggle('done', on);
    el.querySelector('.ans').hidden = !on;
    el.querySelector('button').textContent = on ? 'Yashirish' : 'Javobni ko‘rsatish';
  });
  const big = $('bigClue');
  if (selected != null){
    const p = CW.placed.find(x => x.idx === selected);
    big.innerHTML = `<small>${p.num} · ${p.dir === 'A' ? 'Eniga →' : 'Bo‘yiga ↓'} · ${p.word.length} ta harf</small><span class="bq">${esc(p.clue)}</span>` +
      (revealed.has(p.idx) ? `<span class="bans">${[...p.word].map((ch, i) => `<i style="--i:${i}">${ch}</i>`).join('')}</span>` : '');
  }
}
let lastSel = null;
function select(idx){ selected = idx; if (lastSel !== idx) retrigger($('bigClue'), 'enter'); lastSel = idx; }
function buildClues(){
  const box = $('cluesA');
  CW.placed.slice().sort((a, b) => a.num - b.num || (a.dir === 'A' ? -1 : 1)).forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'clue'; el.dataset.idx = p.idx; el.style.setProperty('--i', i);
    el.innerHTML = `<span class="cn">${p.num}</span><span class="ct"><b class="dir">${p.dir === 'A' ? '→ Eniga' : '↓ Bo‘yiga'}</b> ${esc(p.clue)} <span class="len">(${p.word.length} harf)</span><span class="ans" hidden>${p.word}</span></span>
      <button class="btn small">Javobni ko‘rsatish</button>`;
    el.addEventListener('click', () => { select(p.idx); paint(); });
    el.querySelector('button').addEventListener('click', e => {
      e.stopPropagation(); select(p.idx);
      if (revealed.has(p.idx)){ revealed.delete(p.idx); paint(); }
      else { revealed.add(p.idx); paint(p.idx); }
    });
    box.appendChild(el);
  });
}
function fitGrid(){
  const box = $('gridBox'), w = box.clientWidth - 12;
  if (w <= 0) return;
  const gap = parseFloat(cssVar('--gap')) || 0, max = parseFloat(cssVar('--cs-max')) || 44;
  const cs = Math.max(20, Math.min(max, Math.floor((w - gap * (CW.cols - 1)) / CW.cols)));
  $('grid').style.setProperty('--cs', cs + 'px');
}
$('showAll').onclick = () => { CW.placed.forEach(p => revealed.add(p.idx)); paint('all'); setTimeout(() => burstFrom($('grid'), 140, 1.4), 500); };
$('hideAll').onclick = () => { revealed.clear(); paint(); };
addEventListener('resize', fitGrid);
buildGrid(); buildClues(); paint(); fitGrid(); placeInd();

// sichqoncha ortidan yorug'lik
document.addEventListener('pointermove', e => {
  const o = e.target.closest && e.target.closest('.opt'); if (!o) return;
  const r = o.getBoundingClientRect();
  o.style.setProperty('--mx', (e.clientX - r.left) + 'px'); o.style.setProperty('--my', (e.clientY - r.top) + 'px');
});
</script>
